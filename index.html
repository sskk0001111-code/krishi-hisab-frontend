<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>কৃষি হিসাব - Krishi Hisab</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      margin: 0;
      padding: 10px 8px 30px 8px;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .card, .disease-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .card {
      border: 1px solid #e0e0e0;
      padding: 18px 16px;
    }
    .lang-row {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 12px;
    }
    .btn-lang {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-bn { background: #28a745; color: #ffffff; }
    .btn-en { background: #007bff; color: #ffffff; }
    h2 {
      margin: 0 0 16px 0;
      font-size: 21px;
      color: #1b5e20;
      text-align: center;
      line-height: 1.3;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #333333;
    }
    select, input {
      width: 100%;
      padding: 11px;
      font-size: 15px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      outline: none;
      background: #ffffff;
    }
    select:focus, input:focus { border-color: #2e7d32; }
    
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: #2e7d32;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s ease;
    }
    .btn-submit:hover { background: #1b5e20; }
    .btn-submit:disabled { background: #81c784; cursor: not-allowed; }
    
    #result-box {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: #f1f8e9;
      border-left: 4px solid #2e7d32;
      border-radius: 6px;
      font-size: 15px;
      line-height: 1.8;
      color: #1b5e20;
    }
    .ai-container {
      margin-top: 14px;
      padding: 12px;
      background: #ffffff;
      border-radius: 8px;
      border: 1px dashed #2e7d32;
      color: #2d3748;
      font-size: 14px;
      line-height: 1.6;
    }
    .ai-badge {
      display: inline-block;
      background: #2e7d32;
      color: white;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    /* Accordion & Tabs Styling */
    .disease-btn, .fish-btn {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      margin-bottom: 8px;
    }
    .disease-btn {
      background: #f1f8e9;
      border: 1px solid #c5e1a5;
      color: #2e7d32;
    }
    .disease-btn:hover { background: #dcedc8; border-color: #81c784; }
    
    .fish-btn {
      background: #e1f5fe;
      border: 1px solid #81d4fa;
      color: #0277bd;
    }
    .fish-btn:hover { background: #b3e5fc; border-color: #4fc3f7; }

    .solution-card {
      margin-top: 14px;
      padding: 14px;
      background: #fafafa;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      display: none;
    }
    .sol-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 8px 0;
    }
    .sol-row {
      margin: 6px 0;
      font-size: 14px;
      line-height: 1.5;
      color: #333333;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      transition: all 0.2s;
    }
  </style>
</head>
<body>

  <!-- Calculator Box -->
  <div class="card">
    <div class="lang-row">
      <button type="button" class="btn-lang btn-bn" onclick="switchLang('bn')">বাংলা</button>
      <button type="button" class="btn-lang btn-en" onclick="switchLang('en')">English</button>
    </div>

    <h2 id="calc-title">কৃষি হিসাব - বিঘা-কাঠা ক্যালকুলেটর</h2>

    <div class="form-group">
      <label id="type-label">হিসাবের ধরন নির্বাচন করুন:</label>
      <select id="calc-type" onchange="updateForm()">
        <option value="dhan">ধান (Paddy)</option>
        <option value="alu">আলু (Potato)</option>
        <option value="sorshe">সরিষা (Mustard)</option>
        <option value="pukur">পুকুর প্রস্তুতি (Pond Preparation)</option>
      </select>
    </div>

    <div class="form-group">
      <label id="area-label">জমির পরিমাণ:</label>
      <div style="display: flex; gap: 8px;">
        <input type="number" id="land-area" placeholder="1, 2, 0.5..." step="any" inputmode="decimal" style="flex: 2;">
        <select id="land-unit" style="flex: 1; padding: 11px 6px;">
          <option value="bigha">বিঘা</option>
          <option value="katha">কাঠা</option>
        </select>
      </div>
    </div>

    <button type="button" class="btn-submit" id="calc-btn" onclick="calculateFarm()">হিসাব করুন</button>

    <div id="result-box"></div>
  </div>

  <!-- 1. Paddy Disease Accordion Box -->
  <div class="disease-card" style="padding: 0; overflow: hidden; border: 1.5px solid #81c784;">
    <div onclick="toggleGuide('paddy')" style="display: flex; justify-content: space-between; align-items: center; padding: 16px; cursor: pointer; background: #f1f8e9; user-select: none;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 22px;">🌾</span>
        <h3 style="margin: 0; font-size: 17px; color: #1b5e20; font-weight: 700;">ধানের রোগ ও প্রতিকার গাইড</h3>
      </div>
      <span id="paddy-arrow" style="font-size: 18px; color: #2e7d32; font-weight: bold; transition: transform 0.3s ease;">▼</span>
    </div>

    <div id="paddy-body" style="display: none; padding: 16px; border-top: 1px solid #dcedc8;">
      <div class="form-group">
        <label for="paddy-season" style="font-weight: 700; color: #2e7d32;">মৌসুম বা ধানের ধরন বাছুন:</label>
        <select id="paddy-season" onchange="renderPaddyList()">
          <option value="">-- নির্বাচন করুন --</option>
          <option value="aman">খরিফ বা আমন ধান</option>
          <option value="boro">রবি বা বোরো ধান</option>
          <option value="aus">আউশ ধান</option>
        </select>
      </div>
      <div id="paddy-list-container" style="margin-top: 14px; display: none;">
        <p style="font-size: 13px; font-weight: 700; color: #666; margin-bottom: 8px;">রোগ নির্বাচন করুন (লক্ষণ ও ঔষধ দেখতে ট্যাপ করুন):</p>
        <div id="paddy-list" style="display: flex; flex-direction: column;"></div>
      </div>
      <div id="paddy-solution" class="solution-card" style="border-left: 4px solid #c62828;"></div>
    </div>
  </div>

  <!-- 2. Fish Farming & Disease Accordion Box -->
  <div class="disease-card" style="padding: 0; overflow: hidden; border: 1.5px solid #4fc3f7;">
    <div onclick="toggleGuide('fish')" style="display: flex; justify-content: space-between; align-items: center; padding: 16px; cursor: pointer; background: #e1f5fe; user-select: none;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 22px;">🐟</span>
        <h3 style="margin: 0; font-size: 17px; color: #0277bd; font-weight: 700;">মাছ চাষ ও রোগ প্রতিকার গাইড</h3>
      </div>
      <span id="fish-arrow" style="font-size: 18px; color: #0277bd; font-weight: bold; transition: transform 0.3s ease;">▼</span>
    </div>

    <div id="fish-body" style="display: none; padding: 16px; border-top: 1px solid #b3e5fc;">
      
      <!-- Fish Tabs -->
      <div style="display: flex; gap: 8px; margin-bottom: 16px;">
        <button onclick="switchFishTab('season')" id="tab-season" class="tab-btn" style="background: #0288d1; color: white; border: 1px solid #0288d1;">কোন সিজনে কোন মাছ?</button>
        <button onclick="switchFishTab('disease')" id="tab-disease" class="tab-btn" style="background: #ffffff; color: #0288d1; border: 1px solid #0288d1;">মাছের রোগ ও সমাধান</button>
        <button onclick="switchFishTab('water')" id="tab-water" class="tab-btn" style="background: #ffffff; color: #0288d1; border: 1px solid #0288d1; font-size: 11px; padding: 8px 4px;">জল ব্যবস্থাপনা</button>
      </div>

      <!-- Tab 1: Season Guide -->
      <div id="fish-season-section">
        <div class="form-group">
          <label style="font-weight: 700; color: #0277bd;">মাসের সময়কাল নির্বাচন করুন:</label>
          <select id="fish-season-select" onchange="renderFishSeason()">
            <option value="">-- মাস নির্বাচন করুন --</option>
            <option value="spring">ফেব্রুয়ারি থেকে মে (বসন্ত ও গ্রীষ্মকাল)</option>
            <option value="monsoon">জুন থেকে সেপ্টেম্বর (বর্ষাকাল)</option>
            <option value="autumn">অক্টোবর থেকে নভেম্বর (শরৎ ও হেমন্তকাল)</option>
            <option value="winter">ডিসেম্বর থেকে জানুয়ারি (শীতকাল)</option>
          </select>
        </div>
        <div id="fish-season-solution" class="solution-card" style="border-left: 4px solid #0288d1; background: #f1f9ff;"></div>
      </div>

      <!-- Tab 2: Disease Guide -->
      <div id="fish-disease-section" style="display: none;">
        <p style="font-size: 13px; font-weight: 700; color: #666; margin-bottom: 8px;">রোগ নির্বাচন করুন (লক্ষণ ও ঔষধ দেখতে ট্যাপ করুন):</p>
        <div id="fish-disease-list" style="display: flex; flex-direction: column;"></div>
        <div id="fish-disease-solution" class="solution-card" style="border-left: 4px solid #d32f2f;"></div>
      </div>

!-- Tab 3: Water Management Guide -->
      <div id="fish-water-section" style="display: none;">
        <!-- Sub Tabs -->
        <div style="display: flex; gap: 8px; margin-bottom: 14px;">
          <button onclick="switchWaterSubTab('problems')" id="subtab-problems" class="tab-btn" style="background: #00897b; color: white; border: 1px solid #00897b; font-size: 12px;">জলের সমস্যা ও সমাধান</button>
          <button onclick="switchWaterSubTab('care')" id="subtab-care" class="tab-btn" style="background: #ffffff; color: #00897b; border: 1px solid #00897b; font-size: 12px;">জল ভালো রাখার উপায়</button>
        </div>
      
    </div>
  </div>


  <!-- ================= JAVASCRIPT ================= -->
  <script>
    let currentLang = 'bn';
    let currentController = null;

    const langData = {
      bn: {
        title: "কৃষি হিসাব - বিঘা-কাঠা ক্যালকুলেটর",
        typeLabel: "হিসাবের ধরন নির্বাচন করুন:",
        btn: "হিসাব করুন",
        btnLoading: "হিসাব ও পরামর্শ তৈরি হচ্ছে...",
        error: "অনুগ্রহ করে সঠিক সংখ্যা দিন।",
        seed: "বীজ লাগবে:",
        urea: "ইউরিয়া সার:",
        dap: "ডিএপি (DAP):",
        mop: "পটাশ (MOP):",
        lime: "চুন লাগবে:",
        gobor: "গোবর সার:",
        khail: "সরিষার খৈল:"
      },
      en: {
        title: "Krishi Hisab - Farm Calculator",
        typeLabel: "Select Calculation Type:",
        btn: "Calculate",
        btnLoading: "Calculating & Fetching Advice...",
        error: "Please enter a valid number.",
        seed: "Seed Required:",
        urea: "Urea Fertilizer:",
        dap: "DAP Fertilizer:",
        mop: "Potash (MOP):",
        lime: "Lime Required:",
        gobor: "Cow Dung Manure:",
        khail: "Mustard Cake:"
      }
    };

    const rates = {
      dhan: { label: 'ধান চাষ', seed: 6, urea: 20, dap: 15, mop: 10 },
      alu: { label: 'আলু চাষ', seed: 250, urea: 35, dap: 40, mop: 30 },
      sorshe: { label: 'সরিষা চাষ', seed: 1.2, urea: 12, dap: 15, mop: 8 },
      pukur: { label: 'পুকুর প্রস্তুতি (মাছ চাষ)', lime: 2.5, gobor: 15, khail: 1.5 }
    };

    function switchLang(lang) {
      currentLang = lang;
      const t = langData[lang];
      document.getElementById('calc-title').innerText = t.title;
      document.getElementById('type-label').innerText = t.typeLabel;
      document.getElementById('calc-btn').innerText = t.btn;
      updateForm();
      document.getElementById('result-box').style.display = 'none';
    }

    function updateForm() {
      const type = document.getElementById('calc-type').value;
      const unitSelect = document.getElementById('land-unit');
      const areaLabel = document.getElementById('area-label');

      if (type === 'pukur') {
        areaLabel.innerText = currentLang === 'bn' ? "পুকুরের আয়তন:" : "Pond Area:";
        unitSelect.innerHTML = `<option value="katha">${currentLang === 'bn' ? 'কাঠা' : 'Katha'}</option>`;
      } else {
        areaLabel.innerText = currentLang === 'bn' ? "জমির পরিমাণ:" : "Land Area:";
        unitSelect.innerHTML = `
          <option value="bigha">${currentLang === 'bn' ? 'বিঘা' : 'Bigha'}</option>
          <option value="katha">${currentLang === 'bn' ? 'কাঠা' : 'Katha'}</option>
        `;
      }
    }

    async function calculateFarm() {
      const areaInput = parseFloat(document.getElementById('land-area').value);
      const type = document.getElementById('calc-type').value;
      const resBox = document.getElementById('result-box');
      const calcBtn = document.getElementById('calc-btn');
      const t = langData[currentLang];

      if (isNaN(areaInput) || areaInput <= 0) {
        alert(t.error);
        return;
      }

      // Conversion: 1 Bigha = 20 Katha
      const selectedUnit = document.getElementById('land-unit').value;
      let effectiveArea = areaInput;
      if (type !== 'pukur' && selectedUnit === 'katha') {
        effectiveArea = areaInput / 20;
      }

      if (currentController) currentController.abort();
      currentController = new AbortController();

      calcBtn.disabled = true;
      calcBtn.innerText = t.btnLoading;

      const r = rates[type];
      let calcData = {};
      let outputHtml = "";

      if (type === 'pukur') {
        calcData = {
          lime: (r.lime * effectiveArea).toFixed(2),
          gobor: (r.gobor * effectiveArea).toFixed(2),
          khail: (r.khail * effectiveArea).toFixed(2)
        };
        outputHtml = `<strong>${t.lime}</strong> ${calcData.lime} kg<br>` +
                     `<strong>${t.gobor}</strong> ${calcData.gobor} kg<br>` +
                     `<strong>${t.khail}</strong> ${calcData.khail} kg`;
      } else {
        calcData = {
          seed: (r.seed * effectiveArea).toFixed(2),
          urea: (r.urea * effectiveArea).toFixed(2),
          dap: (r.dap * effectiveArea).toFixed(2),
          mop: (r.mop * effectiveArea).toFixed(2)
        };
        outputHtml = `<strong>${t.seed}</strong> ${calcData.seed} kg<br>` +
                     `<strong>${t.urea}</strong> ${calcData.urea} kg<br>` +
                     `<strong>${t.dap}</strong> ${calcData.dap} kg<br>` +
                     `<strong>${t.mop}</strong> ${calcData.mop} kg`;
      }

      outputHtml += `
        <div class="ai-container">
          <span class="ai-badge">কৃষি AI পরামর্শ</span>
          <div id="ai-text" style="color: #666; font-size: 13px;">পরামর্শ তৈরি হচ্ছে... ⏳</div>
        </div>
      `;

      resBox.innerHTML = outputHtml;
      resBox.style.display = 'block';

      try {
        const response = await fetch('https://krishi-hisab-api.onrender.com/api/ai-advisor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: currentController.signal,
          body: JSON.stringify({ crop_type: r.label, land_area: effectiveArea, calculations: calcData })
        });
        const data = await response.json();
        const aiTextElem = document.getElementById('ai-text');
        if (aiTextElem) {
          aiTextElem.style.color = '#2d3748';
          aiTextElem.innerHTML = data.advice ? data.advice.replace(/\n/g, '<br>') : "পরামর্শ পাওয়া যায়নি।";
        }
      } catch (err) {
        if (err.name !== 'AbortError' && document.getElementById('ai-text')) {
          document.getElementById('ai-text').innerText = "AI সার্ভারের সাথে সংযোগ করা সম্ভব হয়নি।";
        }
      } finally {
        setTimeout(() => {
          calcBtn.disabled = false;
          calcBtn.innerText = t.btn;
        }, 3000);
      }
    }


    /* ================= ACCORDION TOGGLE ================= */
    function toggleGuide(type) {
      const bodyId = type === 'paddy' ? 'paddy-body' : 'fish-body';
      const arrowId = type === 'paddy' ? 'paddy-arrow' : 'fish-arrow';
      const bodyEl = document.getElementById(bodyId);
      const arrowEl = document.getElementById(arrowId);
      
      if (bodyEl.style.display === 'none' || bodyEl.style.display === '') {
        bodyEl.style.display = 'block';
        arrowEl.innerText = '▲';
      } else {
        bodyEl.style.display = 'none';
        arrowEl.innerText = '▼';
      }
    }


    /* ================= PADDY DISEASE DATA & LOGIC ================= */
    const diseaseDatabase = {
      aman: [
        { name: "ব্লাস্ট রোগ (Blast Disease)", symptoms: "পাতায় চোখের মতো দুই দিক চোখা দাগ হয়, মাঝখানে ছাই রঙ ও কিনারা বাদামী। শীষ শুকিয়ে ঝরে পড়ে।", medicine: "ট্রাইসাইক্লাজোল ৭৫% WP (Tricyclazole) — ০.৬ গ্রাম প্রতি লিটার জলে স্প্রে।", company: "Baan (Syngenta) / Beam (Corteva) / SAAF (UPL)" },
        { name: "খোল পচা ও ঝলসানো (Sheath Blight)", symptoms: "গোড়ার খোলে সাপের মতো লম্বাটে জলছাপ দাগ হয়, যা ধীরে ধীরে ওপরের পাতায় ছড়িয়ে গাছ শুকিয়ে দেয়।", medicine: "হেক্সাকোনাজল ৫% SC (Hexaconazole) — ২ মিলি প্রতি লিটার জলে স্প্রে।", company: "Contaf Plus (Tata Rallis) / Sheathmar (Dhanuka)" },

    function switchFishTab(tab) {
      const btnSeason = document.getElementById('tab-season');
      const btnDisease = document.getElementById('tab-disease');
      const secSeason = document.getElementById('fish-season-section');
      const secDisease = document.getElementById('fish-disease-section');

      if(tab === 'season') {
        btnSeason.style.background = '#0288d1'; btnSeason.style.color = 'white';
        btnDisease.style.background = 'white'; btnDisease.style.color = '#0288d1';
        secSeason.style.display = 'block';
        secDisease.style.display = 'none';
      } else {
        btnDisease.style.background = '#0288d1'; btnDisease.style.color = 'white';
        btnSeason.style.background = 'white'; btnSeason.style.color = '#0288d1';
        secDisease.style.display = 'block';
        secSeason.style.display = 'none';
        
        if(document.getElementById('fish-disease-list').innerHTML === '') {
          renderFishDiseaseList();
        }
      }
    }

    function renderFishSeason() {
      const val = document.getElementById('fish-season-select').value;
      const sol = document.getElementById('fish-season-solution');
      
      if(val && fishSeasonDB[val]) {
        sol.innerHTML = `
          <h4 class="sol-title" style="color:#0277bd;">${fishSeasonDB[val].title}</h4>
          <div class="sol-row">${fishSeasonDB[val].desc}</div>`;
        sol.style.display = 'block';
      } else {
        sol.style.display = 'none';
      }
    }

    function renderFishDiseaseList() {
      const list = document.getElementById('fish-disease-list');
      const solBox = document.getElementById('fish-disease-solution');
      solBox.style.display = 'none';
      
      fishDiseaseDB.forEach((item) => {

        btn.className = 'fish-btn';
        btn.innerHTML = `<span>${item.name}</span> <span style="font-size:12px; color:#0277bd;">বিস্তারিত ➔</span>`;
