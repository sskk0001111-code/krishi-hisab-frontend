<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>কৃষি হিসাব - Krishi Hisab</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      margin: 0;
      padding: 10px 8px;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 18px 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .lang-row {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 12px;
    }
    .btn-lang {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-bn { background: #28a745; color: #ffffff; }
    .btn-en { background: #007bff; color: #ffffff; }
    h2 {
      margin: 0 0 16px 0;
      font-size: 21px;
      color: #1b5e20;
      text-align: center;
      line-height: 1.3;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #333333;
    }
    select, input {
      width: 100%;
      padding: 11px;
      font-size: 15px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      outline: none;
      background: #ffffff;
    }
    select:focus, input:focus {
      border-color: #2e7d32;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: #2e7d32;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s ease;
    }
    .btn-submit:hover {
      background: #1b5e20;
    }
    .btn-submit:disabled {
      background: #81c784;
      cursor: not-allowed;
    }
    #result-box {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: #f1f8e9;
      border-left: 4px solid #2e7d32;
      border-radius: 6px;
      font-size: 15px;
      line-height: 1.8;
      color: #1b5e20;
    }
    .ai-container {
      margin-top: 14px;
      padding: 12px;
      background: #ffffff;
      border-radius: 8px;
      border: 1px dashed #2e7d32;
      color: #2d3748;
      font-size: 14px;
      line-height: 1.6;
    }
    .ai-badge {
      display: inline-block;
      background: #2e7d32;
      color: white;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="lang-row">
      <button type="button" class="btn-lang btn-bn" onclick="switchLang('bn')">বাংলা</button>
      <button type="button" class="btn-lang btn-en" onclick="switchLang('en')">English</button>
    </div>

    <h2 id="calc-title">কৃষি হিসাব - বিঘা-কাঠা ক্যালকুলেটর</h2>

    <div class="form-group">
      <label id="type-label">হিসাবের ধরন নির্বাচন করুন:</label>
      <select id="calc-type" onchange="updateForm()">
        <option value="dhan">ধান (Paddy)</option>
        <option value="alu">আলু (Potato)</option>
        <option value="sorshe">সরিষা (Mustard)</option>
        <option value="pukur">পুকুর প্রস্তুতি (Pond Preparation)</option>
      </select>
    </div>

    <div class="form-group">
      <label id="area-label">জমির পরিমাণ (বিঘা):</label>
      <input type="number" id="land-area" placeholder="1, 2, 0.5..." step="any" inputmode="decimal">
    </div>

    <button type="button" class="btn-submit" id="calc-btn" onclick="calculateFarm()">হিসাব করুন</button>

    <div id="result-box"></div>
    
    <!-- নতুন ধানের রোগ ও সমাধান অপশন -->
    <div class="disease-module" style="margin-top: 30px; border-top: 2px dashed #4CAF50; padding-top: 20px;">
      <h3 style="color: #2e7d32; text-align: center;">আপনার ধানের রোগ, সমস্যা ও তার সমাধান</h3>
      
      <label for="paddy-season" style="font-weight: bold;">ধানের ধরন নির্বাচন করুন:</label>
      <select id="paddy-season" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc;">
        <option value="">-- নির্বাচন করুন --</option>
        <option value="aman">খরিফ বা আমন ধান</option>
        <option value="boro">রবি বা বোরো ধান</option>
        <option value="aus">আউশ ধান</option>
      </select>
    
      <div id="disease-list-container" style="margin-top: 20px; display: none;">
        <p style="font-weight: bold; color: #d32f2f;">রোগ নির্বাচন করুন (সবচেয়ে পরিচিত রোগগুলো আগে):</p>
        <div id="disease-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
      </div>
    
      <div id="solution-box" style="margin-top: 20px; padding: 15px; background: #f1f8e9; border: 1px solid #c5e1a5; border-radius: 8px; display: none;">
        <!-- Solution will appear here -->
      </div>
    </div>
  </div>


  <script>
    let currentLang = 'bn';
    let currentController = null; // Purono request cancel korar jonno

    const langData = {
      bn: {
        title: "কৃষি হিসাব - বিঘা-কাঠা ক্যালকুলেটর",
        typeLabel: "হিসাবের ধরন নির্বাচন করুন:",
        areaCrop: "জমির পরিমাণ (বিঘা):",
        areaPond: "পুকুরের আয়তন (কাঠা):",
        btn: "হিসাব করুন",
        btnLoading: "হিসাব ও পরামর্শ তৈরি হচ্ছে...",
        error: "অনুগ্রহ করে সঠিক সংখ্যা দিন।",
        seed: "বীজ লাগবে:",
        urea: "ইউরিয়া সার:",
        dap: "ডিএপি (DAP):",
        mop: "পটাশ (MOP):",
        lime: "চুন লাগবে:",
        gobor: "গোবর সার:",
        khail: "সরিষার খৈল:"
      },
      en: {
        title: "Krishi Hisab - Farm Calculator",
        typeLabel: "Select Calculation Type:",
        areaCrop: "Land Area (Bigha):",
        areaPond: "Pond Area (Katha):",
        btn: "Calculate",
        btnLoading: "Calculating & Fetching Advice...",
        error: "Please enter a valid number.",
        seed: "Seed Required:",
        urea: "Urea Fertilizer:",
        dap: "DAP Fertilizer:",
        mop: "Potash (MOP):",
        lime: "Lime Required:",
        gobor: "Cow Dung Manure:",
        khail: "Mustard Cake:"
      }
    };

    const rates = {
      dhan: { label: 'ধান চাষ', unit: 'bigha', seed: 6, urea: 20, dap: 15, mop: 10 },
      alu: { label: 'আলু চাষ', unit: 'bigha', seed: 250, urea: 35, dap: 40, mop: 30 },
      sorshe: { label: 'সরিষা চাষ', unit: 'bigha', seed: 1.2, urea: 12, dap: 15, mop: 8 },
      pukur: { label: 'পুকুর প্রস্তুতি (মাছ চাষ)', unit: 'katha', lime: 2.5, gobor: 15, khail: 1.5 }
    };

    function switchLang(lang) {
      currentLang = lang;
      const t = langData[lang];
      document.getElementById('calc-title').innerText = t.title;
      document.getElementById('type-label').innerText = t.typeLabel;
      document.getElementById('calc-btn').innerText = t.btn;
      updateForm();
      document.getElementById('result-box').style.display = 'none';
    }

    function updateForm() {
      const type = document.getElementById('calc-type').value;
      const t = langData[currentLang];
      document.getElementById('area-label').innerText = rates[type].unit === 'bigha' ? t.areaCrop : t.areaPond;
    }

    async function calculateFarm() {
      const areaInput = parseFloat(document.getElementById('land-area').value);
      const type = document.getElementById('calc-type').value;
      const resBox = document.getElementById('result-box');
      const calcBtn = document.getElementById('calc-btn');
      const t = langData[currentLang];

      if (isNaN(areaInput) || areaInput <= 0) {
        alert(t.error);
        return;
      }

      // Ager kono ongoing request thakle cancel kora
      if (currentController) {
        currentController.abort();
      }
      currentController = new AbortController();

      // Button temporarily disable kora
      calcBtn.disabled = true;
      calcBtn.innerText = t.btnLoading;

      const r = rates[type];
      let calcData = {};
      let outputHtml = "";

      if (type === 'pukur') {
        calcData = {
          lime: (r.lime * areaInput).toFixed(2),
          gobor: (r.gobor * areaInput).toFixed(2),
          khail: (r.khail * areaInput).toFixed(2)
        };
        outputHtml = `<strong>${t.lime}</strong> ${calcData.lime} kg<br>` +
                     `<strong>${t.gobor}</strong> ${calcData.gobor} kg<br>` +
                     `<strong>${t.khail}</strong> ${calcData.khail} kg`;
      } else {
        calcData = {
          seed: (r.seed * areaInput).toFixed(2),
          urea: (r.urea * areaInput).toFixed(2),
          dap: (r.dap * areaInput).toFixed(2),
          mop: (r.mop * areaInput).toFixed(2)
        };
        outputHtml = `<strong>${t.seed}</strong> ${calcData.seed} kg<br>` +
                     `<strong>${t.urea}</strong> ${calcData.urea} kg<br>` +
                     `<strong>${t.dap}</strong> ${calcData.dap} kg<br>` +
                     `<strong>${t.mop}</strong> ${calcData.mop} kg`;
      }

      outputHtml += `
        <div class="ai-container">
          <span class="ai-badge">কৃষি AI পরামর্শ</span>
          <div id="ai-text" style="color: #666; font-size: 13px;">পরামর্শ তৈরি হচ্ছে... ⏳</div>
        </div>
      `;

      resBox.innerHTML = outputHtml;
      resBox.style.display = 'block';

      try {
        const response = await fetch('https://krishi-hisab-api.onrender.com/api/ai-advisor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: currentController.signal,
          body: JSON.stringify({ 
            crop_type: r.label, 
            land_area: areaInput, 
            calculations: calcData 
          })
        });

        const data = await response.json();
        const aiTextElem = document.getElementById('ai-text');

        if (aiTextElem) {
          if (data.advice) {
            aiTextElem.style.color = '#2d3748';
            aiTextElem.innerHTML = data.advice.replace(/\n/g, '<br>');
          } else {
            aiTextElem.innerText = "পরামর্শ পাওয়া যায়নি।";
          }
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          const aiTextElem = document.getElementById('ai-text');
          if (aiTextElem) {
            aiTextElem.innerText = "AI সার্ভারের সাথে সংযোগ করা সম্ভব হয়নি।";
          }
        }
      } finally {
        // 3 second por button abar enable hobe
        setTimeout(() => {
          calcBtn.disabled = false;
          calcBtn.innerText = t.btn;
        }, 3000);
      }
    }

    // নতুন ধানের রোগ ও সমাধানের JavaScript কোড 
    const diseaseDatabase = {
      aman: [
        {
          name: "ব্লাস্ট রোগ (Blast Disease)",
          symptoms: "পাতায় চোখের মতো দাগ হয়, দাগের মাঝখানটা ছাই রঙের এবং চারপাশ বাদামী রঙের হয়। পরে শিষ শুকিয়ে যায়।",
          medicine: "ট্রাইসাইক্লাজোল ৭৫% WP (Tricyclazole 75% WP) প্রতি লিটার জলে ০.৬ গ্রাম।",
          company: "Syngenta (Baan) / Bayer / PI Industries"
        },
        {
          name: "খোল পচা (Sheath Blight)",
          symptoms: "জলের কাছাকাছি ধানের খোলে ডিম্বাকার কালচে দাগ দেখা যায়। পরে দাগগুলো বড় হয়ে শুকিয়ে যায়।",
          medicine: "হেক্সাকোনাজল ৫% SC (Hexaconazole 5% SC) প্রতি লিটার জলে ২ মিলি।",
          company: "Tata (Contaf Plus) / IFFCO"
        },
        {
          name: "বাদামী দাগ (Brown Spot)",
          symptoms: "পাতায় তিলের মতো ছোট ছোট বাদামী দাগ হয়।",
          medicine: "ম্যানকোজেব ৭৫% WP (Mancozeb 75% WP) প্রতি লিটার জলে ২.৫ গ্রাম।",
          company: "UPL (Indofil M-45) / Syngenta"
        }
      ],
      boro: [
        {
          name: "মাজরা পোকা (Stem Borer)",
          symptoms: "মাঝখানের পাতা শুকিয়ে যায় (Dead heart)। শিষ আসার পর সাদা শিষ বেরিয়ে আসে (White head)।",
          medicine: "কার্টাপ হাইড্রোক্লোরাইড ৫০% SP (Cartap Hydrochloride) বা ক্লোরপাইরিফস।",
          company: "Dhanuka (Caldan) / Syngenta"
        },
        {
          name: "বাদামী শোষক পোকা (BPH - Brown Plant Hopper)",
          symptoms: "গাছের গোড়ায় বসে রস শুষে খায়, ফলে গাছ বাজপড়া মতো গোল হয়ে শুকিয়ে যায় (Hopper burn)।",
          medicine: "পাইমেট্রোজিন ৫০% WG (Pymetrozine) বা ইমিডাক্লোপ্রিড।",
          company: "Syngenta (Chess) / Bayer (Confidor)"
        }
      ],
      aus: [
        {
          name: "গান্ধী পোকা (Gundhi Bug)",
          symptoms: "ধানের দুধ আসার সময় রস শুষে খায়, ফলে ধান চিটে হয়ে যায়। মাঠে দুর্গন্ধ ছাড়ে।",
          medicine: "ল্যাম্বডা সাইহ্যালোথ্রিন ৫% EC (Lambda Cyhalothrin) বা সাইপারমেথ্রিন।",
          company: "Syngenta (Karate) / Bayer"
        }
      ]
    };

    const seasonSelect = document.getElementById('paddy-season');
    const diseaseListContainer = document.getElementById('disease-list-container');
    const diseaseList = document.getElementById('disease-list');
    const solutionBox = document.getElementById('solution-box');

    // যখন ধানের ধরন সিলেক্ট করবে
    seasonSelect.addEventListener('change', function() {
      const selectedSeason = this.value;
      solutionBox.style.display = 'none'; // আগের সমাধান লুকিয়ে ফেলা
      
      if (selectedSeason && diseaseDatabase[selectedSeason]) {
        diseaseList.innerHTML = ''; // আগের লিস্ট পরিষ্কার করা
        const diseases = diseaseDatabase[selectedSeason];
        
        diseases.forEach((disease) => {
          const btn = document.createElement('button');
          btn.innerText = disease.name;
          btn.style.cssText = "padding: 10px; background: #e0f2f1; border: 1px solid #00897b; border-radius: 5px; cursor: pointer; text-align: left; font-weight: bold; margin-bottom: 5px; width: 100%;";
          
          // বাটনে ক্লিক করলে সমাধান দেখাবে
          btn.onclick = function() {
            showSolution(disease);
          };
          
          diseaseList.appendChild(btn);
        });
        
        diseaseListContainer.style.display = 'block';
      } else {
        diseaseListContainer.style.display = 'none';
      }
    });

    // সমাধান দেখানোর ফাংশন
    function showSolution(disease) {
      solutionBox.innerHTML = `
        <h4 style="color: #c62828; margin-top: 0; margin-bottom: 10px;">${disease.name}</h4>
        <p style="margin: 5px 0; line-height: 1.5;"><strong>লক্ষণ:</strong> ${disease.symptoms}</p>
        <p style="margin: 5px 0; line-height: 1.5;"><strong>প্রতিকার ও ঔষধ:</strong> <span style="color: #2e7d32; font-weight: bold;">${disease.medicine}</span></p>
        <p style="margin: 5px 0; line-height: 1.5;"><strong>প্রস্তাবিত কোম্পানি (Recommend):</strong> ${disease.company}</p>
      `;
      solutionBox.style.display = 'block';
      
      // ক্লিক করার পর স্ক্রিনটা সলিউশনের দিকে স্ক্রোল হবে
      setTimeout(() => {
        solutionBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }
  </script>
</body>
</html>
