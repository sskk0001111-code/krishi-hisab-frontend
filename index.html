<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>কৃষি হিসাব - Krishi Hisab</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    body {
      margin: 0;
      padding: 10px 8px;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 18px 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .lang-row {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 12px;
    }
    .btn-lang {
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-bn { background: #28a745; color: #ffffff; }
    .btn-en { background: #007bff; color: #ffffff; }
    h2 {
      margin: 0 0 16px 0;
      font-size: 21px;
      color: #1b5e20;
      text-align: center;
      line-height: 1.3;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #333333;
    }
    select, input {
      width: 100%;
      padding: 11px;
      font-size: 15px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      outline: none;
      background: #ffffff;
    }
    select:focus, input:focus {
      border-color: #2e7d32;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: #2e7d32;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s ease;
    }
    .btn-submit:hover {
      background: #1b5e20;
    }
    .btn-submit:disabled {
      background: #81c784;
      cursor: not-allowed;
    }
    #result-box {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: #f1f8e9;
      border-left: 4px solid #2e7d32;
      border-radius: 6px;
      font-size: 15px;
      line-height: 1.8;
      color: #1b5e20;
    }
    .ai-container {
      margin-top: 14px;
      padding: 12px;
      background: #ffffff;
      border-radius: 8px;
      border: 1px dashed #2e7d32;
      color: #2d3748;
      font-size: 14px;
      line-height: 1.6;
    }
    .ai-badge {
      display: inline-block;
      background: #2e7d32;
      color: white;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    /* Professional Disease Box Styling */
    .disease-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #dcedc8;
      border-radius: 12px;
      padding: 18px 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    .disease-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e8f5e9;
    }
    .disease-header h3 {
      margin: 0;
      font-size: 18px;
      color: #1b5e20;
      font-weight: 700;
    }
    .disease-btn {
      width: 100%;
      padding: 10px 12px;
      background: #f1f8e9;
      border: 1px solid #c5e1a5;
      border-radius: 6px;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      color: #2e7d32;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    .disease-btn:hover {
      background: #dcedc8;
      border-color: #81c784;
    }
    .solution-card {
      margin-top: 14px;
      padding: 14px;
      background: #fafafa;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      border-left: 4px solid #c62828;
      display: none;
    }
    .sol-title {
      font-size: 16px;
      font-weight: 700;
      color: #c62828;
      margin: 0 0 8px 0;
    }
    .sol-row {
      margin: 6px 0;
      font-size: 14px;
      line-height: 1.5;
      color: #333333;
    }
  </style>
</head>
<body>

  <!-- Calculator Box -->
  <div class="card">
    <div class="lang-row">
      <button type="button" class="btn-lang btn-bn" onclick="switchLang('bn')">বাংলা</button>
      <button type="button" class="btn-lang btn-en" onclick="switchLang('en')">English</button>
    </div>

    <h2 id="calc-title">কৃষি হিসাব - বিঘা-কাটা ক্যালকুলেটর</h2>

    <div class="form-group">
      <label id="type-label">হিসাবের ধরন নির্বাচন করুন:</label>
      <select id="calc-type" onchange="updateForm()">
        <option value="dhan">ধান (Paddy)</option>
        <option value="alu">আলু (Potato)</option>
        <option value="sorshe">সরিষা (Mustard)</option>
        <option value="pukur">পুকুর প্রস্তুতি (Pond Preparation)</option>
      </select>
    </div>

        <div class="form-group">
      <label id="area-label">জমির পরিমাণ:</label>
      <div style="display: flex; gap: 8px;">
        <input type="number" id="land-area" placeholder="1, 2, 0.5..." step="any" inputmode="decimal" style="flex: 2;">
        <select id="land-unit" style="flex: 1; padding: 11px 6px;">
          <option value="bigha">বিঘা</option>
          <option value="katha">কাঠা</option>
        </select>
      </div>
    </div>

    <button type="button" class="btn-submit" id="calc-btn" onclick="calculateFarm()">হিসাব করুন</button>

    <div id="result-box"></div>
  </div>

  <!-- Dedicated Disease Box -->
  <div class="disease-card">
    <div class="disease-header">
      <span style="font-size: 20px;">🌾</span>
      <h3 id="disease-header-title">ধানের রোগ ও প্রতিকার গাইড</h3>
    </div>

    <div class="form-group">
      <label for="paddy-season" style="font-weight: 700; color: #2e7d32;">মৌসুম বা ধানের ধরন বাছুন:</label>
      <select id="paddy-season">
        <option value="">-- নির্বাচন করুন --</option>
        <option value="aman">খরিফ বা আমন ধান</option>
        <option value="boro">রবি বা বোরো ধান</option>
        <option value="aus">আউশ ধান</option>
      </select>
    </div>

    <div id="disease-list-container" style="margin-top: 14px; display: none;">
      <p style="font-size: 13px; font-weight: 700; color: #666; margin-bottom: 8px;">রোগ নির্বাচন করুন (লক্ষণ ও ঔষধ দেখতে ট্যাপ করুন):</p>
      <div id="disease-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>

    <div id="solution-box" class="solution-card"></div>
  </div>

  <script>
    let currentLang = 'bn';
    let currentController = null;

    const langData = {
      bn: {
        title: "কৃষি হিসাব - বিঘা-কাটা ক্যালকুলেটর",
        typeLabel: "হিসাবের ধরন নির্বাচন করুন:",
        areaCrop: "জমির পরিমাণ (বিঘা):",
        areaPond: "পুকুরের আয়তন (কাঠা):",
        btn: "হিসাব করুন",
        btnLoading: "হিসাব ও পরামর্শ তৈরি হচ্ছে...",
        error: "অনুগ্রহ করে সঠিক সংখ্যা দিন।",
        seed: "বীজ লাগবে:",
        urea: "ইউরিয়া সার:",
        dap: "ডিএপি (DAP):",
        mop: "পটাশ (MOP):",
        lime: "চুন লাগবে:",
        gobor: "গোবর সার:",
        khail: "সরিষার খৈল:"
      },
      en: {
        title: "Krishi Hisab - Farm Calculator",
        typeLabel: "Select Calculation Type:",
        areaCrop: "Land Area (Bigha):",
        areaPond: "Pond Area (Katha):",
        btn: "Calculate",
        btnLoading: "Calculating & Fetching Advice...",
        error: "Please enter a valid number.",
        seed: "Seed Required:",
        urea: "Urea Fertilizer:",
        dap: "DAP Fertilizer:",
        mop: "Potash (MOP):",
        lime: "Lime Required:",
        gobor: "Cow Dung Manure:",
        khail: "Mustard Cake:"
      }
    };

    const rates = {
      dhan: { label: 'ধান চাষ', unit: 'bigha', seed: 6, urea: 20, dap: 15, mop: 10 },
      alu: { label: 'আলু চাষ', unit: 'bigha', seed: 250, urea: 35, dap: 40, mop: 30 },
      sorshe: { label: 'সরিষা চাষ', unit: 'bigha', seed: 1.2, urea: 12, dap: 15, mop: 8 },
      pukur: { label: 'পুকুর প্রস্তুতি (মাছ চাষ)', unit: 'katha', lime: 2.5, gobor: 15, khail: 1.5 }
    };

    function switchLang(lang) {
      currentLang = lang;
      const t = langData[lang];
      document.getElementById('calc-title').innerText = t.title;
      document.getElementById('type-label').innerText = t.typeLabel;
      document.getElementById('calc-btn').innerText = t.btn;
      updateForm();
      document.getElementById('result-box').style.display = 'none';
    }

        function updateForm() {
      const type = document.getElementById('calc-type').value;
      const unitSelect = document.getElementById('land-unit');
      const areaLabel = document.getElementById('area-label');
      const t = langData[currentLang];

      if (type === 'pukur') {
        areaLabel.innerText = currentLang === 'bn' ? "পুকুরের আয়তন:" : "Pond Area:";
        unitSelect.innerHTML = `<option value="katha">${currentLang === 'bn' ? 'কাঠা' : 'Katha'}</option>`;
      } else {
        areaLabel.innerText = currentLang === 'bn' ? "জমির পরিমাণ:" : "Land Area:";
        unitSelect.innerHTML = `
          <option value="bigha">${currentLang === 'bn' ? 'বিঘা' : 'Bigha'}</option>
          <option value="katha">${currentLang === 'bn' ? 'কাঠা' : 'Katha'}</option>
        `;
      }
    }


    async function calculateFarm() {
      const areaInput = parseFloat(document.getElementById('land-area').value);
      const type = document.getElementById('calc-type').value;
      const resBox = document.getElementById('result-box');
      const calcBtn = document.getElementById('calc-btn');
      const t = langData[currentLang];

      if (isNaN(areaInput) || areaInput <= 0) {
        alert(t.error);
        return;
      }

            // কাঠা থাকলে সেটাকে বিঘায় রূপান্তর (১ বিঘা = ২০ কাঠা)
      const selectedUnit = document.getElementById('land-unit').value;
      let effectiveArea = areaInput;
      if (type !== 'pukur' && selectedUnit === 'katha') {
        effectiveArea = areaInput / 20;
      }
      

      if (currentController) currentController.abort();
      currentController = new AbortController();

      calcBtn.disabled = true;
      calcBtn.innerText = t.btnLoading;

      const r = rates[type];
      let calcData = {};
      let outputHtml = "";

      if (type === 'pukur') {
        calcData = {
          lime: (r.lime * areaInput).toFixed(2),
          gobor: (r.gobor * areaInput).toFixed(2),
          khail: (r.khail * areaInput).toFixed(2)
        };
        outputHtml = `<strong>${t.lime}</strong> ${calcData.lime} kg<br>` +
                     `<strong>${t.gobor}</strong> ${calcData.gobor} kg<br>` +
                     `<strong>${t.khail}</strong> ${calcData.khail} kg`;
      } else {
        calcData = {
          seed: (r.seed * areaInput).toFixed(2),
          urea: (r.urea * areaInput).toFixed(2),
          dap: (r.dap * areaInput).toFixed(2),
          mop: (r.mop * areaInput).toFixed(2)
        };
        outputHtml = `<strong>${t.seed}</strong> ${calcData.seed} kg<br>` +
                     `<strong>${t.urea}</strong> ${calcData.urea} kg<br>` +
                     `<strong>${t.dap}</strong> ${calcData.dap} kg<br>` +
                     `<strong>${t.mop}</strong> ${calcData.mop} kg`;
      }

      outputHtml += `
        <div class="ai-container">
          <span class="ai-badge">কৃষি AI পরামর্শ</span>
          <div id="ai-text" style="color: #666; font-size: 13px;">পরামর্শ তৈরি হচ্ছে... ⏳</div>
        </div>
      `;

      resBox.innerHTML = outputHtml;
      resBox.style.display = 'block';

      try {
        const response = await fetch('https://krishi-hisab-api.onrender.com/api/ai-advisor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: currentController.signal,
          body: JSON.stringify({ 
            crop_type: r.label, 
            land_area: areaInput, 
            calculations: calcData 
          })
        });

        const data = await response.json();
        const aiTextElem = document.getElementById('ai-text');

        if (aiTextElem) {
          if (data.advice) {
            aiTextElem.style.color = '#2d3748';
            aiTextElem.innerHTML = data.advice.replace(/\n/g, '<br>');
          } else {
            aiTextElem.innerText = "পরামর্শ পাওয়া যায়নি।";
          }
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          const aiTextElem = document.getElementById('ai-text');
          if (aiTextElem) aiTextElem.innerText = "AI সার্ভারের সাথে সংযোগ করা সম্ভব হয়নি।";
        }
      } finally {
        setTimeout(() => {
          calcBtn.disabled = false;
          calcBtn.innerText = t.btn;
        }, 3000);
      }
    }

    // Professional Disease Database
    const diseaseDatabase = {
      aman: [
  {
    name: "ব্লাস্ট রোগ (Blast Disease)",
    symptoms: "পাতায় চোখের মতো দুই দিক চোখা দাগ হয়, মাঝখানে ছাই রঙ ও কিনারা বাদামী। শীষ শুকিয়ে ঝরে পড়ে।",
    medicine: "ট্রাইসাইক্লাজোল ৭৫% WP (Tricyclazole) — ০.৬ গ্রাম প্রতি লিটার জলে স্প্রে।",
    company: "Baan (Syngenta) / Beam (Corteva) / SAAF (UPL)"
  },
  {
    name: "খোল পচা ও ঝলসানো (Sheath Blight)",
    symptoms: "গোড়ার খোলে সাপের মতো লম্বাটে জলছাপ দাগ হয়, যা ধীরে ধীরে ওপরের পাতায় ছড়িয়ে গাছ শুকিয়ে দেয়।",
    medicine: "হেক্সাকোনাজল ৫% SC (Hexaconazole) — ২ মিলি প্রতি লিটার জলে স্প্রে।",
    company: "Contaf Plus (Tata Rallis) / Sheathmar (Dhanuka)"
  },
  {
    name: "বাদামী দাগ রোগ (Brown Spot)",
    symptoms: "পাতায় ডিম্বাকার বাদামী তিলের মতো দাগ হয়, যার মাঝে হলুদ বলয় দেখা যায়।",
    medicine: "ম্যানকোজেব ৭৫% WP (Mancozeb) — ২.৫ গ্রাম প্রতি লিটার জলে।",
    company: "Indofil M-45 / Dithane M-45"
  },
  {
    name: "ব্যাকটেরিয়াল লিফ ব্লাইট (পাতা পোড়া)",
    symptoms: "পাতার ডগা ও কিনারা থেকে হলদে-সাদা হয়ে শুকিয়ে যায়। ঝড়-বৃষ্টির পর রোগ খুব বাড়ে।",
    medicine: "স্ট্রেপ্টোসাইক্লিন (Streptocycline) ০.৫ গ্রাম + কপার অক্সিক্লোরাইড ৫০% WP ২.৫ গ্রাম প্রতি লিটার জলে স্প্রে।",
    company: "Streptocycline (Hindustan Antibiotics) / Blitox (Tata Rallis)"
  },
  {
    name: "মিথ্যা কাঁদি / লক্ষ্মীর গু (False Smut)",
    symptoms: "দানা ফুলে হলদে-সবুজ বা কালচে পাউডারের গুটি হয়ে যায়। শীষ বেরোনোর সময় আর্দ্র আবহাওয়ায় বাড়ে।",

    company: "Tilt (Syngenta) / Nativo (Bayer)"

  {
    name: "খোল পচা (Sheath Rot)",
    symptoms: "শীষ বেরোনোর আগে শেষ পাতার খোলে বাদামী দাগ হয়, শীষ আধা বেরিয়ে আটকে যায় ও দানা চিটা হয়।",
    medicine: "কার্বেন্ডাজিম ৫০% WP (Carbendazim) — ১ গ্রাম প্রতি লিটার জলে স্প্রে।",
    company: "Bavistin (BASF) / Derosal (Bayer)"
  },
  {
    name: "টুংরো ভাইরাস (Tungro)",
    symptoms: "গাছ বেঁটে হয়, পাতা হলদে-কমলা হয়ে যায়, কুশি কম হয়। সবুজ গাছফড়িং এই রোগ ছড়ায়। ভাইরাসের কোনো ওষুধ নেই।",
    medicine: "বাহক পোকা দমনে ইমিডাক্লোপ্রিড ১৭.৮% SL (Imidacloprid) — ০.৩ মিলি প্রতি লিটার জলে। আক্রান্ত গাছ তুলে ফেলুন।",
    company: "Confidor (Bayer) / Tatamida (Tata Rallis)"
  },
  {
    name: "খয়রা রোগ (জিংকের অভাব)",
    symptoms: "পাতায় মরচে রঙের ছোপ ছোপ দাগ হয়, গাছ বেঁটে থাকে ও কুশি কমে যায়।",
    medicine: "জিংক সালফেট — ৫ গ্রাম প্রতি লিটার জলে স্প্রে (সঙ্গে সমপরিমাণ চুন মিশিয়ে)। মাটিতে বিঘা প্রতি ৩-৪ কেজি প্রয়োগ করুন।",
    company: "Zinc Sulphate (IFFCO / Coromandel) / Microla (Coromandel)"
  },
  {

    const seasonSelect = document.getElementById('paddy-season');
    const diseaseListContainer = document.getElementById('disease-list-container');
    const diseaseList = document.getElementById('disease-list');
    const solutionBox = document.getElementById('solution-box');

    seasonSelect.addEventListener('change', function() {
      const selectedSeason = this.value;
      solutionBox.style.display = 'none';
      
      if (selectedSeason && diseaseDatabase[selectedSeason]) {
        diseaseList.innerHTML = '';
        const list = diseaseDatabase[selectedSeason];
        
        list.forEach((item) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'disease-btn';
          btn.innerHTML = `<span>${item.name}</span> <span style="font-size:12px; color:#689f38;">বিস্তারিত ➔</span>`;
          btn.onclick = () => renderSolution(item);
          diseaseList.appendChild(btn);
        });
        
        diseaseListContainer.style.display = 'block';
      } else {
        diseaseListContainer.style.display = 'none';
      }
    });

        function renderSolution(disease) {
      solutionBox.innerHTML = `
        <h4 class="sol-title">⚠ ${disease.name}</h4>
        <div class="sol-row"><strong>লক্ষণ:</strong> ${disease.symptoms}</div>
        <div class="sol-row"><strong>কার্যকর ঔষধ ও মাত্রা:</strong> <span style="color:#2e7d32; font-weight:700;">${disease.medicine}</span></div>
        <div class="sol-row"><strong>বিশ্বস্ত ব্র্যান্ড / কোম্পানি:</strong> <span style="color:#1565c0; font-weight:600;">${disease.company}</span></div>
      `;
      solutionBox.style.display = 'block';

      // বাটনে ট্যাপ করার সাথে সাথে স্ক্রিন সমাধানের বক্সে স্ক্রোল হবে
      setTimeout(() => {
        solutionBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 50);
    }

  </script>
