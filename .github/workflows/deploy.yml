name: Deploy Krishi Hisab to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# এটিই আসল সমাধান: নতুন সেভ হলে আগের রান সঙ্গে সঙ্গে নিজে থেকে বাতিল হয়ে যাবে
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
